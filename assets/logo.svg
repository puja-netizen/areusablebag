<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Bag Icon -->
  <g transform="translate(6, 6)">
    <rect x="6" y="16" width="36" height="34" rx="4" fill="url(#logoGrad)" />
    <!-- Gusset shading -->
    <path d="M6 16 L14 16 L14 50 L6 50 Z" fill="#000000" fill-opacity="0.12"/>
    <!-- Handle -->
    <path d="M16 16 V8 C16 4.7 18.7 2 22 2 H26 C29.3 2 32 4.7 32 8 V16" stroke="url(#logoGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Leaf detail on bag -->
    <path d="M22 28 C22 22 30 22 32 20 C32 26 26 34 22 28 Z" fill="url(#leafGrad)"/>
    <path d="M24 28 C26 27 28 25 30 22" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="60" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    A REUSABLE <tspan fill="#16a34a">BAG</tspan>
  </text>
  <text x="60" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="1.5">
    CUSTOM PRINTED &amp; WHOLESALE TOTES
  </text>
</svg>