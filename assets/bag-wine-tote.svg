<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" fill="none">
  <defs>
    <filter id="shadoww" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#shadoww)">
    <!-- Wine Bottle Necks peaking out -->
    <path d="M140 150 V90 H155 V150" fill="#14532d"/>
    <path d="M185 150 V85 H200 V150" fill="#831843"/>
    <path d="M230 150 V90 H245 V150" fill="#14532d"/>
    <!-- Handles -->
    <path d="M145 150 C145 60 255 60 255 150" stroke="#4c0519" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Bag Body Tall -->
    <path d="M110 145 L290 145 L280 405 L120 405 Z" fill="#881337"/>
    <!-- Divider partitions stitch lines -->
    <line x1="168" y1="145" x2="168" y2="405" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.4"/>
    <line x1="232" y1="145" x2="232" y2="405" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.4"/>
    <!-- Wine Glass Logo -->
    <g transform="translate(180, 240)">
      <path d="M15 5 C15 25 35 25 35 5 Z" fill="#ffffff" fill-opacity="0.9"/>
      <line x1="25" y1="25" x2="25" y2="45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="45" x2="35" y2="45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="25" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">ESTATE WINE</text>
    </g>
  </g>
</svg>