<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" fill="none">
  <defs>
    <filter id="shadowc" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#shadowc)">
    <!-- Handles -->
    <path d="M140 140 C140 50 260 50 260 140" stroke="#1e3a8a" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Bag Body -->
    <rect x="80" y="140" width="240" height="260" rx="8" fill="#2563eb"/>
    <!-- Zipper Top Section -->
    <rect x="76" y="132" width="248" height="20" rx="4" fill="#1e293b"/>
    <line x1="84" y1="142" x2="316" y2="142" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="6 3"/>
    <rect x="190" y="137" width="20" height="10" rx="2" fill="#94a3b8"/>
    <!-- Front Pocket -->
    <rect x="110" y="240" width="180" height="140" rx="6" fill="#1d4ed8"/>
    <!-- Thermal Snowflake Emblem -->
    <g transform="translate(175, 175)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <line x1="25" y1="5" x2="25" y2="45"/>
      <line x1="5" y1="25" x2="45" y2="25"/>
      <line x1="11" y1="11" x2="39" y2="39"/>
      <line x1="11" y1="39" x2="39" y2="11"/>
    </g>
    <!-- Mockup Logo on Pocket -->
    <rect x="140" y="270" width="120" height="70" rx="4" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="200" y="310" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">FRESH &amp; CHILLED</text>
  </g>
</svg>